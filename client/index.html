    <style>
      /* Hold the first paint until the account theme is known, so a new account never flashes Dark.
         ThemeProvider removes "theme-pending" once it has the saved preference; the timeout is a safety net. */
      html.theme-pending body { visibility: hidden; }
    </style>
    <script>
      (function() {
        try {
          var root = document.documentElement;
          // Dev preview pages do not mount ThemeProvider, so they are never held.
          if (window.location.pathname.indexOf("/dev/") !== 0) {
            root.classList.add("theme-pending");
            setTimeout(function() { root.classList.remove("theme-pending"); }, 2500);
          }
          var stored = localStorage.getItem("theme");
          // Never follow the device setting by default. Unset = Light (new-account default).
          var theme = stored === "dark" ? "dark" : "light";
          root.classList.remove("light", "dark");
          root.classList.add(theme);
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
