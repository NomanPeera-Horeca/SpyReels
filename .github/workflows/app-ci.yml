name: SpyReels App CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spyreels-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check app safety
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run critical feature regressions before the global typecheck so an
      # unrelated baseline type failure cannot hide whether Viral Posts itself
      # is safe. The global gate still runs immediately after this and remains
      # required for merge.
      - name: Run Viral Posts reliability regression tests
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm vitest run server/viralPosts/tests/diversity.test.ts

      - name: Typecheck and project checks
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm check

      - name: Run Remake regression tests
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm vitest run server/libraryRemakeChainCore.test.ts server/scriptTools.test.ts server/remakeStudioImport.test.ts

      - name: Build app
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build

      - name: Full regression suite
        continue-on-error: true
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm test
