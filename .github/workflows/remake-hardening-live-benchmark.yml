name: Remake Hardening Live Benchmark

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/remake-hardening-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}

    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify live benchmark credentials
        run: |
          test -n "$SCRAPECREATORS_API_KEY" || (echo "SCRAPECREATORS_API_KEY missing" && exit 1)
          test -n "$ANTHROPIC_API_KEY" || (echo "ANTHROPIC_API_KEY missing" && exit 1)
          test -n "$DEEPGRAM_API_KEY" || (echo "DEEPGRAM_API_KEY missing" && exit 1)
          test -n "$SERPER_API_KEY" || (echo "SERPER_API_KEY missing" && exit 1)
          ffmpeg -version >/dev/null 2>&1 || (echo "ffmpeg missing" && exit 1)

      - name: Run 30-case real Reel benchmark
        run: pnpm tsx scripts/remake-hardening-live-benchmark.ts

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remake-hardening-live-benchmark
          path: artifacts/remake-hardening-live-benchmark.json
          if-no-files-found: warn
