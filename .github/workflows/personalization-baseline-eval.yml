# Baseline evaluation of onboarding Goal / Audience / Pillars on today's code.
# Explicitly authorized by the founder: 30 synthetic profiles plus a replay of
# real SpyReels customers (public profile facts only, read-only DB login).
# Runs only on this branch, only when the commit message STARTS with
# "eval: [authorized-baseline-eval]" (mentioning the marker elsewhere does not run it).
# "[real-only]" in that message skips the synthetic part.
# No deployment, no production writes. Hard spend caps:
# synthetic generation $1.20 + judging $0.30, real generation $4.90 + judging $0.90.
name: SpyReels Personalization Baseline Evaluation

on:
  push:
    branches:
      - claude/personalization-baseline-eval

permissions:
  contents: read
  actions: read

jobs:
  baseline:
    if: "${{ startsWith(github.event.head_commit.message, 'eval: [authorized-baseline-eval]') && !contains(github.event.head_commit.message, '[rejudge]') && !contains(github.event.head_commit.message, '[review-pack]') && !contains(github.event.head_commit.message, '[spot-check]') && !contains(github.event.head_commit.message, '[starter-check]') && !contains(github.event.head_commit.message, '[lookup-probe]') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVAL_DB_READONLY_URL: ${{ secrets.EVAL_DB_READONLY_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require the AI key
        shell: bash
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "ANTHROPIC_API_KEY GitHub secret is not configured."
            exit 1
          fi

      - name: Synthetic 30 - generate (cap $1.20)
        if: ${{ !contains(github.event.head_commit.message, '[real-only]') }}
        run: pnpm exec tsx scripts/personalization-intelligence-eval.ts --confirm-spend --cap=1.20 --out=baseline-synthetic

      - name: Synthetic 30 - independent judge (cap $0.30)
        if: ${{ !contains(github.event.head_commit.message, '[real-only]') }}
        run: pnpm exec tsx scripts/personalization-quality-judge.ts --confirm-spend --in=baseline-synthetic --cap=0.30

      - name: Synthetic 30 - results
        if: always() && !contains(github.event.head_commit.message, '[real-only]')
        run: |
          pnpm exec tsx scripts/personalization-quality-judge.ts --in=baseline-synthetic --report-only || true
          pnpm exec tsx scripts/personalization-eval-digest.ts --in=baseline-synthetic || true

      - name: Real customers - export (read-only login)
        id: export
        if: always()
        shell: bash
        run: |
          if [ -z "${EVAL_DB_READONLY_URL:-}" ]; then
            echo "EVAL_DB_READONLY_URL is not configured; skipping the real-customer replay."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm exec tsx scripts/personalization-real-customers-export.ts --out="$RUNNER_TEMP/real-cases.json"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Real customers - generate (cap $4.90)
        if: always() && steps.export.outputs.ready == 'true'
        run: pnpm exec tsx scripts/personalization-intelligence-eval.ts --confirm-spend --cap=4.90 --out=baseline-real --fixtures="$RUNNER_TEMP/real-cases.json"

      - name: Real customers - independent judge (cap $0.90)
        if: always() && steps.export.outputs.ready == 'true'
        run: pnpm exec tsx scripts/personalization-quality-judge.ts --confirm-spend --in=baseline-real --cap=0.90 --fixtures="$RUNNER_TEMP/real-cases.json"

      - name: Real customers - results
        if: always() && steps.export.outputs.ready == 'true'
        run: |
          pnpm exec tsx scripts/personalization-quality-judge.ts --in=baseline-real --report-only --fixtures="$RUNNER_TEMP/real-cases.json" || true
          pnpm exec tsx scripts/personalization-eval-digest.ts --in=baseline-real || true

      - name: Delete the real-customer cases file
        if: always()
        run: rm -f "$RUNNER_TEMP/real-cases.json"

      - name: Upload results (outputs and scores only, no profile bios)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spyreels-personalization-baseline
          path: |
            docs/evals/personalization-intelligence/baseline-*.json
            docs/evals/personalization-intelligence/baseline-*.md
          if-no-files-found: warn
          retention-days: 14

  # Fair re-test: re-score two saved generation runs with the judge seeing the
  # same posts and thumbnails the generator saw. No new generation.
  # Commit subject: "eval: [authorized-baseline-eval] [rejudge] ..."
  rejudge:
    if: "${{ startsWith(github.event.head_commit.message, 'eval: [authorized-baseline-eval] [rejudge]') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVAL_DB_READONLY_URL: ${{ secrets.EVAL_DB_READONLY_URL }}
      BEFORE_RUN_ID: "41225653056"
      AFTER_RUN_ID: "41235635420"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Saved results - before Phase 1 (goal-v3)
        uses: actions/download-artifact@v4
        with:
          name: spyreels-personalization-baseline
          path: ${{ runner.temp }}/before
          run-id: ${{ env.BEFORE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Saved results - after Phase 1
        uses: actions/download-artifact@v4
        with:
          name: spyreels-personalization-baseline
          path: ${{ runner.temp }}/after
          run-id: ${{ env.AFTER_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Real customers - export (read-only login)
        shell: bash
        run: |
          pnpm exec tsx scripts/personalization-real-customers-export.ts --out="$RUNNER_TEMP/real-cases.json"
          # Case ids follow sign-up order. Both saved runs had R001-R077 and N001-N035;
          # a different count means ids may have shifted, so stop before spending.
          node -e '
            const ids = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).map(c => c.id);
            const r = ids.filter(i => i.startsWith("R")).length, n = ids.filter(i => i.startsWith("N")).length;
            console.log(JSON.stringify({ linked: r, notPosting: n }));
            if (r !== 77 || n !== 35) { console.error("Customer ids no longer line up with the saved runs."); process.exit(1); }
          ' "$RUNNER_TEMP/real-cases.json"
          cp "$RUNNER_TEMP/before/baseline-real.json" docs/evals/personalization-intelligence/before-real.json
          cp "$RUNNER_TEMP/after/baseline-real.json" docs/evals/personalization-intelligence/phase1-real.json

      - name: Re-score before Phase 1 with posts and thumbnails (cap $1.40)
        run: pnpm exec tsx scripts/personalization-quality-judge.ts --confirm-spend --cap=1.40 --in=before-real --with-posts --linked-only --ids-from=phase1-real --fixtures="$RUNNER_TEMP/real-cases.json"

      - name: Re-score after Phase 1 with posts and thumbnails (cap $1.40)
        if: always()
        run: pnpm exec tsx scripts/personalization-quality-judge.ts --confirm-spend --cap=1.40 --in=phase1-real --with-posts --linked-only --ids-from=before-real --fixtures="$RUNNER_TEMP/real-cases.json"

      - name: Compare
        if: always()
        run: pnpm exec tsx scripts/personalization-judge-compare.ts --before=before-real-judge-posts --after=phase1-real-judge-posts

      - name: Delete the real-customer cases file
        if: always()
        run: rm -f "$RUNNER_TEMP/real-cases.json"

      - name: Upload re-scores (scores only, no profile bios)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spyreels-personalization-rejudge
          path: docs/evals/personalization-intelligence/*-judge-posts.json
          if-no-files-found: warn
          retention-days: 14

  # Founder blind review: what the AI showed real customers in onboarding
  # (production) vs what today's code shows the same 30 customers.
  # Commit subject: "eval: [authorized-baseline-eval] [review-pack] ..."
  review-pack:
    if: "${{ startsWith(github.event.head_commit.message, 'eval: [authorized-baseline-eval] [review-pack]') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVAL_DB_READONLY_URL: ${{ secrets.EVAL_DB_READONLY_URL }}
      REVIEW_SEED: founder-review-2026-11-01
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Real customers - export (read-only login)
        run: pnpm exec tsx scripts/personalization-real-customers-export.ts --out="$RUNNER_TEMP/real-cases.json"

      - name: Pick 30 customers who were shown AI suggestions
        id: pick
        shell: bash
        run: |
          pnpm exec tsx scripts/personalization-review-pack.ts --select --n=30 --seed="$REVIEW_SEED" --fixtures="$RUNNER_TEMP/real-cases.json" | tee "$RUNNER_TEMP/pick.txt"
          grep '^ids=' "$RUNNER_TEMP/pick.txt" >> "$GITHUB_OUTPUT"

      - name: Generate today's version for those customers (cap $1.50, images off as in production)
        run: pnpm exec tsx scripts/personalization-intelligence-eval.ts --confirm-spend --cap=1.50 --out=review-after --cases="${{ steps.pick.outputs.ids }}" --fixtures="$RUNNER_TEMP/real-cases.json"

      - name: Build the blind review page
        run: pnpm exec tsx scripts/personalization-review-pack.ts --build --after=review-after --seed="$REVIEW_SEED" --out="$RUNNER_TEMP/review/strategy-review.html" --fixtures="$RUNNER_TEMP/real-cases.json"

      - name: Delete the real-customer cases file
        if: always()
        run: rm -f "$RUNNER_TEMP/real-cases.json"

      - name: Upload the review page (private to repository members)
        uses: actions/upload-artifact@v4
        with:
          name: strategy-review
          path: ${{ runner.temp }}/review/strategy-review.html
          if-no-files-found: error
          retention-days: 14

  # Generation only, for the customer ids listed in the commit subject:
  # "eval: [authorized-baseline-eval] [spot-check] cases=R001,R012 ..."
  spot-check:
    if: "${{ startsWith(github.event.head_commit.message, 'eval: [authorized-baseline-eval] [spot-check]') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVAL_DB_READONLY_URL: ${{ secrets.EVAL_DB_READONLY_URL }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Real customers - export (read-only login)
        run: pnpm exec tsx scripts/personalization-real-customers-export.ts --out="$RUNNER_TEMP/real-cases.json" > /dev/null

      - name: Generate for the listed customers (cap $0.80)
        shell: bash
        run: |
          ids=$(printf '%s' "$COMMIT_MESSAGE" | head -1 | grep -o 'cases=[A-Z0-9,]*' | cut -d= -f2)
          test -n "$ids"
          pnpm exec tsx scripts/personalization-intelligence-eval.ts --confirm-spend --cap=0.80 --out=spot-check --cases="$ids" --fixtures="$RUNNER_TEMP/real-cases.json"

      - name: Results (strategy outputs only, no profile text)
        if: always()
        run: pnpm exec tsx scripts/personalization-eval-digest.ts --in=spot-check || true

      - name: Delete the real-customer cases file
        if: always()
        run: rm -f "$RUNNER_TEMP/real-cases.json"

  # Starter questions: each "I don't post yet" customer with and without
  # (simulated) starter answers, generated and judged on the same code.
  starter-check:
    if: "${{ startsWith(github.event.head_commit.message, 'eval: [authorized-baseline-eval] [starter-check]') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVAL_DB_READONLY_URL: ${{ secrets.EVAL_DB_READONLY_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Real customers - export (read-only login)
        run: pnpm exec tsx scripts/personalization-real-customers-export.ts --out="$RUNNER_TEMP/real-cases.json" > /dev/null

      - name: Not-posting customers, with and without answers
        id: make
        shell: bash
        run: |
          pnpm exec tsx scripts/personalization-starter-variants.ts --make --in="$RUNNER_TEMP/real-cases.json" --out="$RUNNER_TEMP/starter-cases.json" | tee "$RUNNER_TEMP/make.txt"
          grep '^ids=' "$RUNNER_TEMP/make.txt" >> "$GITHUB_OUTPUT"

      - name: Generate (cap $1.60)
        run: pnpm exec tsx scripts/personalization-intelligence-eval.ts --confirm-spend --cap=1.60 --out=starter-check --cases="${{ steps.make.outputs.ids }}" --fixtures="$RUNNER_TEMP/starter-cases.json"

      - name: Judge (cap $0.50)
        if: always()
        run: pnpm exec tsx scripts/personalization-quality-judge.ts --confirm-spend --cap=0.50 --in=starter-check --fixtures="$RUNNER_TEMP/starter-cases.json"

      - name: Compare
        if: always()
        run: |
          pnpm exec tsx scripts/personalization-starter-variants.ts --compare --judge=starter-check-judge || true
          pnpm exec tsx scripts/personalization-eval-digest.ts --in=starter-check || true

      - name: Delete the real-customer cases files
        if: always()
        run: rm -f "$RUNNER_TEMP/real-cases.json" "$RUNNER_TEMP/starter-cases.json"

  # Live onboarding lookup health check: real public accounts on Instagram,
  # TikTok and YouTube through the production lookup code. No database, no
  # storage writes. Commit subject: "eval: [authorized-baseline-eval] [lookup-probe] ..."
  lookup-probe:
    if: "${{ startsWith(github.event.head_commit.message, 'eval: [authorized-baseline-eval] [lookup-probe]') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require the provider key
        shell: bash
        run: |
          if [ -z "${SCRAPECREATORS_API_KEY:-}" ]; then
            echo "SCRAPECREATORS_API_KEY GitHub secret is not configured."
            exit 1
          fi

      - name: Look up real accounts on all three platforms
        env:
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          # Optional "handles=instagram:a,b;tiktok:c" in the commit subject checks only those.
          first_line="$(printf '%s' "$COMMIT_SUBJECT" | head -n1)"
          handles="$(printf '%s' "$first_line" | grep -oE 'handles=[A-Za-z0-9_.,;:@-]+' | head -n1 | cut -d= -f2- || true)"
          export PROBE_HANDLES="$handles"
          pnpm exec tsx scripts/profile-lookup-probe.ts
