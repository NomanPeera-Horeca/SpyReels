# Daily + manual production SEO smoke for every URL in the live sitemap.
# Failures mark the run red and open (or comment on) a tracking issue so
# watchers get GitHub notification email. Optional SMTP email if secrets exist.
#
# Optional secrets for email:
#   SEO_SMOKE_SMTP_SERVER, SEO_SMOKE_SMTP_PORT, SEO_SMOKE_SMTP_USER,
#   SEO_SMOKE_SMTP_PASSWORD, SEO_SMOKE_NOTIFY_TO, SEO_SMOKE_NOTIFY_FROM

name: production-seo-smoke

on:
  schedule:
    # 13:00 UTC daily
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-seo-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: production-seo-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Run production SEO smoke
        id: smoke
        working-directory: public-web
        env:
          SEO_SITEMAP_URL: https://spyreels.ai/sitemap.xml
        run: node scripts/production-seo-smoke.mjs

      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Production SEO smoke FAILED';
            const body = [
              '## Production SEO smoke failed',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Ref: \`${context.ref}\``,
              `Actor: ${context.actor}`,
              '',
              'Every public sitemap URL must return 200, meta robots index/follow (browser + Googlebot),',
              'no X-Robots-Tag noindex, and canonical self.',
              '',
              'Re-run: Actions → production-seo-smoke → Run workflow',
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 50,
            });
            const existing = issues.data.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Commented on issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              core.info(`Opened issue #${created.data.number}`);
            }

      - name: Detect optional SMTP email config
        id: mailcfg
        if: failure()
        env:
          SEO_SMOKE_NOTIFY_TO: ${{ secrets.SEO_SMOKE_NOTIFY_TO }}
          SEO_SMOKE_SMTP_PASSWORD: ${{ secrets.SEO_SMOKE_SMTP_PASSWORD }}
          SEO_SMOKE_SMTP_SERVER: ${{ secrets.SEO_SMOKE_SMTP_SERVER }}
        run: |
          if [ -n "$SEO_SMOKE_NOTIFY_TO" ] && [ -n "$SEO_SMOKE_SMTP_PASSWORD" ] && [ -n "$SEO_SMOKE_SMTP_SERVER" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SMTP secrets not set; skipping email (GitHub issue + Actions failure email still notify)."
          fi

      - name: Email on failure (optional SMTP secrets)
        if: failure() && steps.mailcfg.outputs.enabled == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SEO_SMOKE_SMTP_SERVER }}
          server_port: 587
          username: ${{ secrets.SEO_SMOKE_SMTP_USER }}
          password: ${{ secrets.SEO_SMOKE_SMTP_PASSWORD }}
          subject: "[SpyReels] Production SEO smoke FAILED"
          to: ${{ secrets.SEO_SMOKE_NOTIFY_TO }}
          from: ${{ secrets.SEO_SMOKE_NOTIFY_FROM }}
          body: |
            Production SEO smoke failed.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Check the job log and the "Production SEO smoke FAILED" GitHub issue.
